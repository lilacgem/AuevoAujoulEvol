<style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
    canvas { display: block; }
    #ambient-title {
        position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0;
        text-align: center; color: rgba(255,255,255,0.5); font-family: 'Courier New', monospace;
        font-size: 12px; letter-spacing: 0.4em; text-transform: uppercase; pointer-events: none; z-index: 10;
    }
    #star-info {
        position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
        max-width: 90vw; width: 420px; text-align: center; font-family: 'Courier New', monospace;
        color: #fff; background: rgba(6,6,10,0.85); border: 1px solid rgba(0,243,255,0.25);
        border-radius: 12px; padding: 16px 20px; backdrop-filter: blur(10px); z-index: 10;
        display: none; box-sizing: border-box;
    }
    #star-info .realm { color: #00f3ff; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
    #star-info .date { color: rgba(255,255,255,0.4); font-size: 10px; margin-top: 8px; }
    #gate-note { color: #ffd700; font-size: 10px; margin-top: 6px; letter-spacing: 0.1em; }
    #need-login {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px; text-align: center; padding: 24px; box-sizing: border-box;
        font-family: 'Courier New', monospace; color: #fff; z-index: 20;
    }
    #need-login p { max-width: 420px; color: rgba(255,255,255,0.6); font-size: 13px; line-height: 1.7; }
    #need-login a {
        color: #00f3ff; border: 1px solid rgba(0,243,255,0.4); padding: 10px 22px;
        border-radius: 999px; text-decoration: none; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    }
    #loading-state {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: rgba(255,255,255,0.3); font-family: 'Courier New', monospace; font-size: 11px;
        letter-spacing: 0.2em; text-transform: uppercase; z-index: 15;
    }
</style>
</head>
<body>

<div id="ambient-title">EVOLVING ROOTS</div>
<div id="loading-state">Gathering what has resonated...</div>
<div id="star-info">
    <div class="realm" id="star-realm"></div>
    <div id="star-message"></div>
    <div class="date" id="star-date"></div>
    <div id="gate-note" style="display:none;">A gate was open here</div>
</div>
<div id="need-login">
    <p>Evolving Roots is grown from what you've already sealed. Return to EvoMirror and sign in — your pattern is what shapes this space.</p>
    <a href="https://evomirror.com">Return to EvoMirror</a>
</div>

<script>
const SUPABASE_URL = 'https://mwiziojeqhzwoygbcttq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_PRdPGdDmDSmdO0yiDLBDTA_6UcurViL';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Same six realms as EvoMirror, same hue anchors, so a person's colors
// carry over into this space rather than starting from nothing.
const REALM_ANCHORS = {
    "RUBY ROOT ANCHOR": { hue: 0,   angle: 0 },
    "AMBER KUNDALINI":  { hue: 45,  angle: 60 },
    "EMERALD HEART":    { hue: 110, angle: 120 },
    "AZURE THROAT":     { hue: 180, angle: 180 },
    "INDIGO THIRD EYE": { hue: 240, angle: 240 },
    "VIOLET CROWN":     { hue: 300, angle: 300 }
};
const CLUSTER_RADIUS = 40;

function matchRealmKey(realmText) {
    if (!realmText) return null;
    const upper = realmText.toUpperCase();
    return Object.keys(REALM_ANCHORS).find(key => upper.includes(key)) || null;
}

async function init() {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const authUser = sessionData.session ? sessionData.session.user : null;

    if (!authUser) {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('need-login').style.display = 'flex';
        return;
    }

    const { data: seals, error } = await supabaseClient
        .from('seals')
        .select('matrix_coordinates, evo_metrics, created_at')
        .eq('user_id', authUser.id)
        .order('created_at', { ascending: true });

    if (error || !seals || seals.length === 0) {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('need-login').style.display = 'flex';
        return;
    }

    document.getElementById('loading-state').style.display = 'none';
    buildScene(seals);
}

function buildScene(seals) {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 20, 130);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 30;
    controls.maxDistance = 400;

    // Background starfield, same technique as EvoMirror's ambient scene
    const bgStarGeo = new THREE.BufferGeometry();
    const bgStarCount = 2000;
    const bgPositions = new Float32Array(bgStarCount * 3);
    for (let i = 0; i < bgStarCount; i++) {
        bgPositions[i * 3] = (Math.random() - 0.5) * 1000;
        bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 1000;
        bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 1000;
    }
    bgStarGeo.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
    const bgStarMat = new THREE.PointsMaterial({ color: 0x334455, size: 0.6, transparent: true, opacity: 0.5 });
    scene.add(new THREE.Points(bgStarGeo, bgStarMat));

    // Group this identity's seals by realm - this is the actual "vault
    // connection": every star below corresponds to a real sealed moment.
    const realmGroups = {};
    seals.forEach(seal => {
        const realmKey = matchRealmKey(seal.matrix_coordinates && seal.matrix_coordinates.oracle_realm);
        if (!realmKey) return;
        if (!realmGroups[realmKey]) realmGroups[realmKey] = [];
        realmGroups[realmKey].push(seal);
    });

    const clickableStars = [];
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 1.5;

    Object.keys(realmGroups).forEach(realmKey => {
        const anchor = REALM_ANCHORS[realmKey];
        const realmSeals = realmGroups[realmKey];
        const angleRad = (anchor.angle * Math.PI) / 180;
        const clusterCenter = new THREE.Vector3(
            Math.cos(angleRad) * CLUSTER_RADIUS,
            (Math.random() - 0.5) * 12,
            Math.sin(angleRad) * CLUSTER_RADIUS
        );

        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(realmSeals.length * 3);
        const starColors = new Float32Array(realmSeals.length * 3);
        const starSizes = new Float32Array(realmSeals.length);

        realmSeals.forEach((seal, i) => {
            const spread = 8 + Math.min(realmSeals.length * 0.3, 10);
            const px = clusterCenter.x + (Math.random() - 0.5) * spread;
            const py = clusterCenter.y + (Math.random() - 0.5) * spread;
            const pz = clusterCenter.z + (Math.random() - 0.5) * spread;
            starPositions[i * 3] = px;
            starPositions[i * 3 + 1] = py;
            starPositions[i * 3 + 2] = pz;

            const isGate = seal.evo_metrics && seal.evo_metrics.is_gate;
            const color = new THREE.Color();
            if (isGate) {
                color.setHSL(0.13, 0.95, 0.65); // gold, matches EvoMirror's gate color
            } else {
                color.setHSL(anchor.hue / 360, 0.85, 0.6);
            }
            starColors[i * 3] = color.r;
            starColors[i * 3 + 1] = color.g;
            starColors[i * 3 + 2] = color.b;
            starSizes[i] = isGate ? 3.2 : 1.6;

            clickableStars.push({ position: new THREE.Vector3(px, py, pz), seal, realmKey, isGate });
        });

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

        const starMat = new THREE.PointsMaterial({
            size: 2, vertexColors: true, transparent: true, opacity: 0.95,
            sizeAttenuation: true, blending: THREE.AdditiveBlending
        });
        scene.add(new THREE.Points(starGeo, starMat));
    });

    // The user's own current seal shape drifts through this space,
    // built with the same digital-root logic as EvoMirror.
    const latestSeal = seals[seals.length - 1];
    const level = (latestSeal.evo_metrics && latestSeal.evo_metrics.g_root_level) || 1;
    const CONSTRAINT_DIGITS = [1, 2, 4, 5, 7, 8];
    const SACRED_DIGITS = [3, 6, 9];
    function digitalRoot(n) {
        const abs = Math.abs(Math.round(n));
        if (abs === 0) return 0;
        const r = abs % 9;
        return r === 0 ? 9 : r;
    }
    const root = digitalRoot(level);
    const isGateNow = SACRED_DIGITS.includes(root);
    const idx = CONSTRAINT_DIGITS.indexOf(root);
    const pParam = isGateNow ? 1 : root;
    const qParam = isGateNow ? 1 : CONSTRAINT_DIGITS[(idx + 2) % CONSTRAINT_DIGITS.length];

    const vesselGeo = new THREE.TorusKnotGeometry(6, 0.5, 150, 14, pParam, qParam);
    const vesselMat = new THREE.MeshBasicMaterial({
        color: isGateNow ? 0xffd700 : 0xd400ff,
        wireframe: true, transparent: true, opacity: 0.8
    });
    const vessel = new THREE.Mesh(vesselGeo, vesselMat);
    scene.add(vessel);

    let driftAngle = 0;
    let hoveredIndex = -1;

    function onPointerMove(event) {
        const mouse = new THREE.Vector2(
            (event.clientX / window.innerWidth) * 2 - 1,
            -(event.clientY / window.innerHeight) * 2 + 1
        );
        raycaster.setFromCamera(mouse, camera);

        let closestDist = Infinity;
        let closestStar = null;
        clickableStars.forEach(star => {
            const dist = raycaster.ray.distanceToPoint(star.position);
            if (dist < 3 && dist < closestDist) {
                closestDist = dist;
                closestStar = star;
            }
        });

        const infoBox = document.getElementById('star-info');
        if (closestStar) {
            document.getElementById('star-realm').innerText = closestStar.realmKey;
            document.getElementById('star-message').innerText =
                (closestStar.seal.matrix_coordinates && closestStar.seal.matrix_coordinates.oracle_message) || '';
            document.getElementById('star-date').innerText =
                new Date(closestStar.seal.created_at).toLocaleDateString();
            document.getElementById('gate-note').style.display = closestStar.isGate ? 'block' : 'none';
            infoBox.style.display = 'block';
        } else {
            infoBox.style.display = 'none';
        }
    }
    window.addEventListener('pointermove', onPointerMove);

    function animate() {
        requestAnimationFrame(animate);
        driftAngle += 0.0015;
        vessel.position.x = Math.sin(driftAngle) * 15;
        vessel.position.z = Math.cos(driftAngle) * 15;
        vessel.rotation.x += 0.003;
        vessel.rotation.y += 0.004;
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

init();
</script>
</body>
</html>
