<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolving Roots — Private Constellation</title><meta name="description" content="A local constellation viewer for an EvoMirror archive you deliberately choose to import."><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#030806;color:#ecffe9;font:14px/1.5 ui-monospace,monospace}#ui{position:fixed;inset:0;z-index:4;pointer-events:none}nav,header,#info{pointer-events:auto}nav{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a,button{color:#e9d58b;background:#071108cc;border:1px solid #87d88b66;border-radius:999px;padding:8px 12px;text-decoration:none;font:inherit;cursor:pointer}header{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:min(700px,90vw);text-align:center}h1{letter-spacing:.28em;font-size:clamp(1rem,3vw,1.5rem)}p{color:#c3d8c0}#info{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(520px,90vw);padding:14px;border:1px solid #87d88b55;border-radius:14px;background:#051007dc;text-align:center}.hidden{display:none}</style></head><body><div id="ui"><nav><span><a href="https://evomirror.com">EvoMirror</a> <a href="https://aujoule.com">AUJOULE</a></span><span><a href="https://lisajevolving.com">Lisa Jevolving</a></span></nav><header><h1>EVOLVING ROOTS</h1><p>A private constellation grown from an EvoMirror archive you choose to import.</p><input id="file" type="file" accept="application/json,.json" hidden><button id="import">IMPORT PRIVATE ARCHIVE</button> <a href="https://evomirror.com">OPEN EVOMIRROR</a></header><div id="info">Nothing is uploaded. Import stays in this browser tab until you refresh or close it.</div></div><script>
const realms={"RUBY ROOT ANCHOR":0,"AMBER KUNDALINI":45,"EMERALD HEART":110,"AZURE THROAT":180,"INDIGO THIRD EYE":240,"VIOLET CROWN":300};let renderer,scene,camera,controls,vessel;
function key(t){t=(t||'').toUpperCase();return Object.keys(realms).find(k=>t.includes(k))||'VIOLET CROWN'}
function build(sessions){if(renderer)renderer.domElement.remove();scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,2000);camera.position.set(0,15,110);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const bg=new THREE.BufferGeometry(),p=new Float32Array(3000);for(let i=0;i<p.length;i++)p[i]=(Math.random()-.5)*900;bg.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(bg,new THREE.PointsMaterial({color:0x456b4b,size:.7,transparent:true,opacity:.7})));const groups={};sessions.forEach(x=>{const k=key(x.matrix_coordinates?.oracle_realm);(groups[k]??=[]).push(x)});Object.entries(groups).forEach(([name,list],n)=>{const geo=new THREE.BufferGeometry(),pos=new Float32Array(list.length*3),col=new Float32Array(list.length*3);const a=n*Math.PI*2/6,c=new THREE.Vector3(Math.cos(a)*38,0,Math.sin(a)*38);list.forEach((s,i)=>{pos.set([c.x+(Math.random()-.5)*12,c.y+(Math.random()-.5)*12,c.z+(Math.random()-.5)*12],i*3);const color=new THREE.Color().setHSL(s.evo_metrics?.is_gate?.13:realms[name]/360,.8,.62);col.set([color.r,color.g,color.b],i*3)});geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:2.2,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending})))});const last=sessions.at(-1),shape=last?.visualState?.shape||last?.evo_metrics?.shape||{p:3,q:8};vessel=new THREE.Mesh(new THREE.TorusKnotGeometry(5,.45,140,14,shape.p||3,shape.q||8),new THREE.MeshBasicMaterial({color:0xd4a843,wireframe:true,transparent:true,opacity:.85}));scene.add(vessel);document.querySelector('#info').textContent=`${sessions.length} private session${sessions.length===1?'':'s'} visualized locally. Refreshing clears this imported view.`;animate()}
function animate(){requestAnimationFrame(animate);if(vessel){vessel.rotation.x+=.003;vessel.rotation.y+=.004}controls?.update();renderer?.render(scene,camera)}
document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const a=JSON.parse(await f.text());if(a.schema!=="evomirror-private-archive/v1"||!Array.isArray(a.sessions))throw Error('Choose an EvoMirror private archive export.');build(a.sessions)}catch(err){document.querySelector('#info').textContent='Import failed: '+err.message}};addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});</script></body></html>
