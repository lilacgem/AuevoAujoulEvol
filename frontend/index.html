    <style>
        :root {
            --bg-color: #000002;
            --matrix-green: #39ff14;
            --matrix-orange: #ff5e00;
            --matrix-violet: #8b00ff;
            --gold-luxe: #d4af37;
            --text-muted: #666666;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-width: 100vw;
            min-height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            -webkit-user-select: none;
            user-select: none;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            touch-action: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: auto;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            z-index: 10;
            background: transparent;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: max(12px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)) 14px;
            box-sizing: border-box;
        }

        .ambient-note {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: min(92vw, 560px);
            text-align: center;
            color: rgba(255, 255, 255, 0.86);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.08);
            pointer-events: none;
            z-index: 20;
        }

        .ambient-title {
            font-size: 0.86rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.92);
        }

        .ambient-equation {
            font-size: 1.1rem;
            font-family: 'Times New Roman', Times, serif;
            color: var(--gold-luxe);
            margin-top: 2px;
        }

        .ambient-status {
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            color: rgba(220, 220, 220, 0.68);
            margin-top: 4px;
        }

        .dashboard {
            width: min(92vw, 420px);
            background: rgba(4, 5, 9, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 10px;
            box-sizing: border-box;
            display: grid;
            gap: 8px;
            font-size: 9px;
            letter-spacing: 0.5px;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            pointer-events: auto;
            margin-top: auto;
            opacity: 0.95;
            box-shadow: 0 0 18px rgba(255,255,255,0.03);
        }

        .grid-core {
            display: grid;
            gap: 8px;
        }

        .orb-shell {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 120px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.05);
            background:
                radial-gradient(circle at center, rgba(255,255,255,0.02), rgba(255,255,255,0.01) 45%, rgba(0,0,0,0) 70%),
                linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            box-shadow: inset 0 0 26px rgba(255,255,255,0.04), 0 0 18px rgba(255,255,255,0.02);
        }

        .spectral-orb {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.96), rgba(57,255,20,0.35) 33%, rgba(255,94,0,0.18) 68%, rgba(0,0,0,0.0) 100%);
            box-shadow: 0 0 34px rgba(57,255,20,0.38), 0 0 60px rgba(255,94,0,0.2);
            border: 1px solid rgba(255,255,255,0.14);
            transform: scale(1);
            transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .spectral-ring {
            position: absolute;
            inset: 8px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 0 14px rgba(255,255,255,0.04), 0 0 16px rgba(255,255,255,0.03);
            pointer-events: none;
        }

        .sphere-grid {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .sphere-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.03), 0 0 10px rgba(255,255,255,0.02);
        }

        .ring-1 { width: 54px; height: 54px; transform: rotateX(70deg); }
        .ring-2 { width: 74px; height: 74px; transform: rotateY(70deg); }
        .ring-3 { width: 92px; height: 92px; transform: rotateZ(20deg); }

        .coordinate-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 4px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.04);
        }

        .coord {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 20px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.72);
            background: rgba(255,255,255,0.02);
            font-size: 8px;
            letter-spacing: 0.25em;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.02);
        }

        .mini-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .metric-chip {
            padding: 6px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.8);
            font-size: 8px;
            text-transform: uppercase;
        }

        .metric-chip strong {
            color: #d4af37;
            margin-left: 4px;
        }

        .control-row {
            display: flex;
            gap: 8px;
        }

        .mini-note {
            font-size: 8px;
            color: rgba(255, 170, 0, 0.75);
            line-height: 1.3;
        }

        .btn-core {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.88);

        .btn-core.primary { border-color: var(--matrix-green); color: var(--matrix-green); }
        .btn-core.secondary { border-color: var(--matrix-orange); color: var(--matrix-orange); }

        .btn-core:hover:not(:disabled) {

            padding: 6px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

<body>

            <div class="control-row">
                <button id="micButton" class="btn-core secondary" type="button">ENABLE MIRROR</button>

            <div class="mini-note" id="adviceDisplay">Mirror memory state initializing.</div>

    </div>

    <script>
        const ABCAuEvoAujouleAuEvoAujoulEvolvE = {
            identity: { signature: "AuEvoAujouleEvol", environment: "AU_SOVEREIGN" },
            domains: ["lisajevolving.com","evolvingroots.org","aujoule.com","evomirror.com"],
            security: {
                md5: "AC56D958959FED985DEB6C47771F4B78", 
                sha1: "8FF721A1C3154EBF0D7C93138C9404AF10ED2326",
                sha256: "BBA46AB01717170CD3470A0A06AAC388FE308B754726D5DC62C59F78BBF7688A",
                sha512: "F20DD2B8B599C1960D9D308E4DBFF88D15E77231FA57C20438A6BBF4A1E7A7D65BA........."
            }
        };

        function Aueo() {
            Object.freeze(ABCAuEvoAujouleAuEvoAujoulEvolvE);
            localStorage.setItem("evo_sovereign_seal", ABCAuEvoAujouleAuEvoAujoulEvolvE.security.sha512); 
            window.AU_SOVEREIGN = { signature: ABCAuEvoAujouleAuEvoAujoulEvolvE.identity.signature, security: ABCAuEvoAujouleAuEvoAujoulEvolvE.security };
        }
        Aueo();

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000002, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000.0);
        camera.position.set(0.0, 0.0, 55.0);

        const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#bg'), alpha: false, preserveDrawingBuffer: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));

        let touchVector = { x: 0.0, y: 0.0 };
        let lastTouchVector = { x: 0.0, y: 0.0 };
        let touchVelocity = 0.0;
        let targetVelocity = 0.0;
        let isInteracting = false;
        let dynamicFactor = 0.18;
        let colorAccumulator = 0.5;

        function handleInteractionMove(clientX, clientY) {
            lastTouchVector.x = touchVector.x; lastTouchVector.y = touchVector.y;
            touchVector.x = (clientX / window.innerWidth) * 2.0 - 1.0;
            touchVector.y = -(clientY / window.innerHeight) * 2.0 + 1.0;
            targetVelocity = Math.min(Math.sqrt(Math.pow(touchVector.x - lastTouchVector.x, 2) + Math.pow(touchVector.y - lastTouchVector.y, 2)) * 12.0, 3.5);
            isInteracting = true;
        }

        window.addEventListener('mousemove', (e) => handleInteractionMove(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) handleInteractionMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1400;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 400.0;
            positions[i + 1] = (Math.random() - 0.5) * 400.0;
            positions[i + 2] = (Math.random() - 0.5) * 300.0;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starfield = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.4 }));
        scene.add(starfield);

        const geometry = new THREE.SphereGeometry(14.0, 48, 48);
        const baseVertices = geometry.attributes.position.clone();
        const videoElement = document.getElementById('evoCoreVideo');
        const videoTexture = new THREE.VideoTexture(videoElement);
        
        const mirrorMaterial = new THREE.MeshBasicMaterial({ map: videoTexture, transparent: true, opacity: 0.75, wireframe: true, side: THREE.DoubleSide });
        const mirrorSphere = new THREE.Mesh(geometry, mirrorMaterial);
        scene.add(mirrorSphere);

        // COMBINED AUDIO & WAVE FREQUENCY PROCESSING
        let audioContext, analyser, dataArray, micSource, audioTrackSource;
        const micButton = document.getElementById('micButton');
        const nativeAudio = document.getElementById('nativeAudioTrack');

        if (micButton) {
            micButton.addEventListener('click', async () => {
                try {
                    if (!audioContext) {
                        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        audioContext = new AudioContextClass();
                    }
                    if (audioContext.state === 'suspended') await audioContext.resume();

                    // Play elements concurrently
                    await videoElement.play();
                    await nativeAudio.play();

                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.85;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                    // Track audio root stream
                    audioTrackSource = audioContext.createMediaElementSource(nativeAudio);
                    audioTrackSource.connect(analyser);

                    // Connect secondary hardware track if available
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        const micStream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
                        if (micStream) {
                            micSource = audioContext.createMediaStreamSource(micStream);
                            micSource.connect(analyser);
                            document.getElementById('micStatus').innerText = "CONNECTED";
                        }
                    }

                    analyser.connect(audioContext.destination);

                    micButton.innerText = "MIRROR ACTIVE";
                    micButton.style.borderColor = "#00ffaa";
                    micButton.style.color = "#00ffaa";
                    document.getElementById('recordButton').disabled = false;

                } catch (err) {
                    console.warn('System initialization parameters updated:', err);
                }
            });
        }

        function processVocalTelemetry() {
            let totalVolume = 0.0, normalizedVol = 0.0;
            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                for (let i = 0; i < dataArray.length; i++) { totalVolume += dataArray[i]; }
                normalizedVol = totalVolume / (dataArray.length * 255.0);
                dynamicFactor = THREE.MathUtils.lerp(dynamicFactor, normalizedVol * 6.0 + 0.15, 0.2);
            } else {
                dynamicFactor = THREE.MathUtils.lerp(dynamicFactor, 0.18, 0.05);
            }

            colorAccumulator = (colorAccumulator + 0.0015 + (normalizedVol * 0.01) + (touchVelocity * 0.004)) % 1.0;
            mirrorMaterial.opacity = isInteracting ? 0.85 : 0.65 + (normalizedVol * 0.3);

            const spectralOrb = document.getElementById('spectralOrb');
            const pulsePercent = Math.min(100, Math.round((normalizedVol + touchVelocity * 0.25) * 100));

            if (spectralOrb) {
                let glowColor = pulsePercent > 70 ? 'rgba(139,0,255,0.45)' : (pulsePercent > 35 ? 'rgba(255,94,0,0.35)' : 'rgba(57,255,20,0.35)');
                spectralOrb.style.transform = `scale(${1 + pulsePercent / 180})`;
                spectralOrb.style.boxShadow = `0 0 ${18 + pulsePercent * 0.35}px ${glowColor}, 0 0 ${28 + pulsePercent * 0.6}px rgba(255,255,255,0.08)`;
            }

            if (document.getElementById('hueDisplay')) document.getElementById('hueDisplay').innerText = `${Math.round(colorAccumulator * 360.0)}°`;
            if (document.getElementById('resDisplay')) document.getElementById('resDisplay').innerText = dynamicFactor.toFixed(3);
        }

        let evoHistory = JSON.parse(localStorage.getItem('AuEvo_Genetic_Ledger')) || { totalSeals: 0, accumulatedResonance: 0.18 };
        let personalSymbolMesh = null;

        function ReflectSovereignSymbol(history, liveResonance, liveColor) {
            if (personalSymbolMesh) { scene.remove(personalSymbolMesh); personalSymbolMesh.geometry.dispose(); personalSymbolMesh.material.dispose(); }
            const totalSeals = history.totalSeals || 1;
            const pParam = Math.round(totalSeals) % 9 || 3;
            const qParam = Math.round(liveResonance * 10) % 9 || 4;

            const symbolGeometry = new THREE.TorusKnotGeometry(5.5, 1.0 + (liveResonance * 0.4), 80, 12, pParam, qParam);
            const symbolMaterial = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(liveColor, 0.95, 0.50), wireframe: true, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
            
            personalSymbolMesh = new THREE.Mesh(symbolGeometry, symbolMaterial);
            scene.add(personalSymbolMesh);
        }

        document.getElementById('recordButton').addEventListener('click', () => {
            evoHistory.totalSeals += 1;
            localStorage.setItem('AuEvo_Genetic_Ledger', JSON.stringify(evoHistory));
            document.getElementById('stampDisplay').innerText = `STAMP ${evoHistory.totalSeals}`;
        });

        function animate() {
            requestAnimationFrame(animate);
            touchVelocity = THREE.MathUtils.lerp(touchVelocity, targetVelocity, 0.08);
            targetVelocity *= 0.94;

            processVocalTelemetry();
            ReflectSovereignSymbol(evoHistory, dynamicFactor, colorAccumulator);

            const time = Date.now() * 0.001;
            const positionAttribute = geometry.attributes.position;
            for (let i = 0; i < positionAttribute.count; i++) {
                const bx = baseVertices.getX(i), by = baseVertices.getY(i), bz = baseVertices.getZ(i);
                const waveX = Math.sin(by * 0.25 + time * 3.0) * (0.4 + touchVelocity * 0.8);
                const waveY = Math.cos(bx * 0.25 + time * 2.5) * (0.3 + dynamicFactor * 0.5);
                positionAttribute.setXYZ(i, bx + waveX, by + waveY, bz);
            }
            positionAttribute.needsUpdate = true;
            geometry.computeVertexNormals();

            mirrorSphere.rotation.y += 0.003 + (touchVelocity * 0.02);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
