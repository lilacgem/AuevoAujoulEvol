<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090a">
<meta name="robots" content="noindex, nofollow">
<title>Writing desk | Lisa J Evolving</title>
<style>
:root{color-scheme:dark;--ink:#07090a;--line:rgba(229,241,235,.14);--paper:#f1f3ec;--muted:#98a39d;--green:#a6ff72;--cyan:#65e9e5;--orange:#ff8755;--serif:Georgia,"Times New Roman",serif;--mono:"Courier New",monospace}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;color:var(--paper);background-color:var(--ink);background-image:radial-gradient(rgba(168,255,115,.1) .7px,transparent .7px);background-size:24px 24px;font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.55}button,input,textarea,select{font:inherit}button,a,input,textarea,select{ -webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}a{color:inherit}.shell{width:min(1200px,calc(100% - 48px));margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:64px;border-bottom:1px solid var(--line);font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase}.brand{color:var(--green);text-decoration:none}.top-links{display:flex;gap:20px;color:var(--muted)}.top-links a{text-decoration:none}.top-links a:hover{color:var(--cyan)}
.heading{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:34px 0 24px}.eyebrow{color:var(--cyan);font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase}.heading h1{margin:7px 0 0;font:400 42px/1.1 var(--serif)}.session-status{max-width:360px;min-height:22px;color:var(--muted);font:11px var(--mono);text-align:right}.session-status.error{color:var(--orange)}.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 152px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.entry-panel{padding:23px 20px 30px 0;border-right:1px solid var(--line)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:15px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;color:var(--muted);font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase}.new-button{min-height:36px;padding:8px 11px;border:1px solid rgba(166,255,114,.5);border-radius:2px;color:var(--green);background:rgba(166,255,114,.05);cursor:pointer;font:10px var(--mono);letter-spacing:.06em}.new-button:hover{background:rgba(166,255,114,.13)}.entries-list{display:grid}.entry-button{display:grid;gap:4px;width:100%;padding:14px 10px;border:0;border-bottom:1px solid var(--line);border-left:2px solid transparent;color:var(--paper);background:transparent;text-align:left;cursor:pointer}.entry-button:hover,.entry-button[aria-current=true]{border-left-color:var(--cyan);background:rgba(101,233,229,.05)}.entry-title{overflow:hidden;font:16px/1.3 var(--serif);text-overflow:ellipsis;white-space:nowrap}.entry-info{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font:9px var(--mono);text-transform:uppercase}.entry-info .draft{color:var(--orange)}.list-empty{padding:18px 0;color:var(--muted);font:11px/1.7 var(--mono)}.editor{padding:24px 0 34px 30px}.editor-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.editor-top h2{margin:0;font:400 24px var(--serif)}.entry-key{color:var(--muted);font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase}.field{display:grid;gap:8px;margin-bottom:20px}.field label{color:var(--muted);font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:2px;color:var(--paper);background:rgba(255,255,255,.025)}.field input,.field select{min-height:44px;padding:10px 12px}.field textarea{min-height:340px;padding:14px;resize:vertical;line-height:1.8}.field input::placeholder,.field textarea::placeholder{color:#64706a}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);outline:none}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.editor-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:18px;border-top:1px solid var(--line)}.action{min-height:42px;padding:10px 15px;border:1px solid var(--line);border-radius:2px;color:var(--paper);background:transparent;cursor:pointer;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase}.action:hover{border-color:var(--cyan);color:var(--cyan)}.action.publish{border-color:var(--green);color:var(--ink);background:var(--green)}.action.publish:hover{background:#c4ffa5}.action.delete{margin-left:auto;border-color:rgba(255,135,85,.4);color:var(--orange)}.action.delete:hover{background:rgba(255,135,85,.08)}.action:disabled{opacity:.55;cursor:wait}.status-line{min-height:22px;margin-top:12px;color:var(--muted);font:10px var(--mono)}.status-line.error{color:var(--orange)}.status-line.success{color:var(--green)}.footnote{padding:17px 0 28px;color:var(--muted);font:9px var(--mono);letter-spacing:.06em}
@media(max-width:760px){.shell{width:calc(100% - 32px)}.heading{align-items:start;flex-direction:column;gap:12px}.heading h1{font-size:36px}.session-status{text-align:left}.workspace{grid-template-columns:1fr}.entry-panel{padding:18px 0;border-right:0;border-bottom:1px solid var(--line)}.entries-list{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.editor{padding:22px 0 30px}.field-row{grid-template-columns:1fr;gap:0}.field textarea{min-height:260px}.action.delete{margin-left:0}.topbar{min-height:58px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="shell topbar"><a class="brand" href="/">LJ / Evolving</a><nav class="top-links" aria-label="Owner navigation"><a href="/">View journal</a><a href="/cdn-cgi/access/logout">Sign out</a></nav></header>
<main class="shell">
    <div class="heading"><div><div class="eyebrow">Private writing desk</div><h1>Your journal</h1></div><div class="session-status" id="sessionStatus" role="status" aria-live="polite">Checking owner access…</div></div>
    <div class="workspace">
        <aside class="entry-panel" aria-label="Saved entries"><div class="panel-head"><h2>All notes</h2><button class="new-button" id="newEntry" type="button">+ New note</button></div><div class="entries-list" id="entriesList"></div></aside>
        <section class="editor" aria-labelledby="editorTitle"><div class="editor-top"><h2 id="editorTitle">A new page</h2><span class="entry-key" id="entryKey">Unsaved note</span></div>
            <form id="entryForm">
                <div class="field"><label for="title">Title</label><input id="title" name="title" maxlength="160" required placeholder="Give this thought a name"></div>
                <div class="field-row"><div class="field"><label for="category">Category</label><input id="category" name="category" maxlength="60" placeholder="Reflection"></div><div class="field"><label for="mood">Feeling (optional)</label><input id="mood" name="mood" maxlength="60" placeholder="A word for the moment"></div></div>
                <div class="field"><label for="body">Your writing</label><textarea id="body" name="body" maxlength="50000" required placeholder="Start wherever you are…"></textarea></div>
                <div class="editor-actions"><button class="action" id="saveDraft" type="button">Save draft</button><button class="action publish" id="publishEntry" type="button">Publish entry</button><button class="action delete" id="deleteEntry" type="button" hidden>Delete</button></div>
                <div class="status-line" id="formStatus" role="status" aria-live="polite"></div>
            </form>
        </section>
    </div>
    <div class="footnote">Drafts remain private. Only entries you publish appear in the public archive.</div>
</main>
<script>
const entriesList=document.getElementById('entriesList');const sessionStatus=document.getElementById('sessionStatus');const formStatus=document.getElementById('formStatus');const form=document.getElementById('entryForm');const titleInput=document.getElementById('title');const categoryInput=document.getElementById('category');const moodInput=document.getElementById('mood');const bodyInput=document.getElementById('body');const editorTitle=document.getElementById('editorTitle');const entryKey=document.getElementById('entryKey');const deleteButton=document.getElementById('deleteEntry');const saveButtons=[document.getElementById('saveDraft'),document.getElementById('publishEntry')];let entries=[];let selectedId=null;let dirty=false;
function setStatus(element,message,type=''){element.textContent=message;element.className=element===formStatus?`status-line ${type}`:`session-status ${type}`}
function dateLabel(value){if(!value)return'Not published';const date=new Date(value);return Number.isNaN(date.getTime())?'Date unknown':new Intl.DateTimeFormat('en',{month:'short',day:'numeric',year:'numeric'}).format(date)}
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',headers:options.body?{'Content-Type':'application/json'}:undefined,...options});let data={};try{data=await response.json()}catch(error){}if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
function renderList(){entriesList.replaceChildren();if(!entries.length){const empty=document.createElement('div');empty.className='list-empty';empty.textContent='No saved notes yet. Start with a new page.';entriesList.append(empty);return}entries.forEach(entry=>{const button=document.createElement('button');button.type='button';button.className='entry-button';button.setAttribute('aria-current',String(entry.id===selectedId));const title=document.createElement('span');title.className='entry-title';title.textContent=entry.title;const info=document.createElement('span');info.className='entry-info';const status=document.createElement('span');status.className=entry.status==='draft'?'draft':'';status.textContent=entry.status;const date=document.createElement('span');date.textContent=dateLabel(entry.updated_at);info.append(status,date);button.append(title,info);button.addEventListener('click',()=>selectEntry(entry.id));entriesList.append(button)})}
function resetForm(){selectedId=null;dirty=false;form.reset();editorTitle.textContent='A new page';entryKey.textContent='Unsaved note';deleteButton.hidden=true;setStatus(formStatus,'');renderList();titleInput.focus()}
function selectEntry(id){if(dirty&&!window.confirm('Discard unsaved changes?'))return;const entry=entries.find(item=>item.id===id);if(!entry)return;selectedId=entry.id;dirty=false;titleInput.value=entry.title;categoryInput.value=entry.category||'';moodInput.value=entry.mood||'';bodyInput.value=entry.body;editorTitle.textContent=entry.title;entryKey.textContent=entry.status==='published'?'Published entry':'Private draft';deleteButton.hidden=false;setStatus(formStatus,'');renderList()}
async function loadEntries(){try{const data=await api('/api/admin/entries');entries=Array.isArray(data.entries)?data.entries:[];sessionStatus.textContent='Owner access verified';sessionStatus.className='session-status';renderList()}catch(error){sessionStatus.textContent=error.message;sessionStatus.className='session-status error';entriesList.replaceChildren();setStatus(formStatus,'Sign in with your authorized Cloudflare Access account to use the editor.','error');saveButtons.forEach(button=>button.disabled=true)}}
async function saveEntry(status){if(!form.reportValidity())return;saveButtons.forEach(button=>button.disabled=true);setStatus(formStatus,'Saving…');const entry={title:titleInput.value.trim(),category:categoryInput.value.trim(),mood:moodInput.value.trim(),body:bodyInput.value.trim(),status};try{const saved=selectedId?await api(`/api/admin/entries/${encodeURIComponent(selectedId)}`,{method:'PUT',body:JSON.stringify(entry)}):await api('/api/admin/entries',{method:'POST',body:JSON.stringify(entry)});selectedId=saved.id;dirty=false;await loadEntries();selectEntry(selectedId);setStatus(formStatus,status==='published'?'Published to your journal.':'Draft saved.','success')}catch(error){setStatus(formStatus,error.message,'error')}finally{saveButtons.forEach(button=>button.disabled=false)}}
document.getElementById('newEntry').addEventListener('click',()=>{if(dirty&&!window.confirm('Discard unsaved changes?'))return;resetForm()});document.getElementById('saveDraft').addEventListener('click',()=>saveEntry('draft'));document.getElementById('publishEntry').addEventListener('click',()=>saveEntry('published'));form.addEventListener('input',()=>{dirty=true});form.addEventListener('submit',event=>event.preventDefault());deleteButton.addEventListener('click',async()=>{if(!selectedId||!window.confirm('Permanently delete this entry?'))return;deleteButton.disabled=true;try{await api(`/api/admin/entries/${encodeURIComponent(selectedId)}`,{method:'DELETE'});entries=entries.filter(entry=>entry.id!==selectedId);resetForm();setStatus(formStatus,'Entry deleted.','success')}catch(error){setStatus(formStatus,error.message,'error')}finally{deleteButton.disabled=false}});
loadEntries();
</script>
</body>
</html>
